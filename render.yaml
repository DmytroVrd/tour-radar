# Render Blueprint: one free Docker web service built from this repo.
services:
  - type: web
    name: tour-radar
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: QLOO_MOCK
        value: "0"
      - key: CACHE_DIR
        value: /tmp/tour-radar-cache
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: QLOO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
