name: Keep the demo awake

# The free hosting tier sleeps after 15 minutes without traffic, so ping it
# every 10 minutes to keep the demo awake for visitors and judges.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then echo "Set the DEMO_URL repository variable"; exit 0; fi
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 "$DEMO_URL/api/health"
